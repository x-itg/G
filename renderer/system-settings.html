<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置 - 放射化学纯度检测仪</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .page-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #667eea;
        }

        .page-title {
            font-size: 28px;
            color: #2d3748;
            font-weight: 600;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: #5568d3;
        }

        .settings-panel {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .settings-panel h2 {
            color: #2d3748;
            margin: 0 0 20px 0;
            font-size: 22px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a5568;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group-inline {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .help-text {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e0;
            transition: 0.4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #667eea;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .switch-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .switch-label {
            font-weight: 500;
            color: #4a5568;
        }

        .alert {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-info {
            background: #e6f7ff;
            color: #0066cc;
            border-left: 4px solid #0066cc;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-link">← 返回主页</a>
        
        <div class="page-header">
            <h1 class="page-title">🛠️ 系统设置</h1>
        </div>

        <div id="save-alert" class="alert alert-success" style="display: none;">
            ✅ 设置已成功保存！
        </div>

        <!-- 检测参数设置 -->
        <div class="settings-panel">
            <h2>检测参数</h2>
            
            <div class="form-group-inline">
                <div class="form-group">
                    <label for="scan-length">扫描长度 (mm)</label>
                    <input type="number" id="scan-length" value="100" min="10" max="200" step="1">
                    <span class="help-text">硅胶板扫描的总长度</span>
                </div>
                <div class="form-group">
                    <label for="position-step">位置步长 (mm)</label>
                    <input type="number" id="position-step" value="0.1" min="0.05" max="2" step="0.05">
                    <span class="help-text">每次移动的距离</span>
                </div>
            </div>

            <div class="form-group-inline">
                <div class="form-group">
                    <label for="integration-time">积分时间 (s)</label>
                    <input type="number" id="integration-time" value="1" min="0.1" max="10" step="0.1">
                    <span class="help-text">每个点的采集时间</span>
                </div>
                <div class="form-group">
                    <label for="count-rate-max">计数率上限 (cps)</label>
                    <input type="number" id="count-rate-max" value="5000" min="1000" max="10000" step="100">
                    <span class="help-text">最大允许计数率</span>
                </div>
            </div>
        </div>

        <!-- 设备配置 -->
        <div class="settings-panel">
            <h2>设备配置</h2>
            
            <div class="form-group">
                <label for="probe-port">探头端口</label>
                <select id="probe-port">
                    <option value="auto">自动检测</option>
                    <option value="COM1">COM1</option>
                    <option value="COM2">COM2</option>
                    <option value="COM3">COM3</option>
                    <option value="COM4">COM4</option>
                </select>
            </div>

            <div class="form-group">
                <label for="baud-rate">波特率</label>
                <select id="baud-rate">
                    <option value="9600">9600</option>
                    <option value="19200">19200</option>
                    <option value="38400">38400</option>
                    <option value="57600">57600</option>
                    <option value="115200" selected>115200</option>
                </select>
            </div>

            <div class="switch-group">
                <span class="switch-label">启用自动重连</span>
                <label class="switch">
                    <input type="checkbox" id="auto-reconnect" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="switch-group">
                <span class="switch-label">启用设备健康检查</span>
                <label class="switch">
                    <input type="checkbox" id="health-check" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- 数据处理设置 -->
        <div class="settings-panel">
            <h2>数据处理</h2>
            
            <div class="form-group">
                <label for="smoothing-method">平滑算法</label>
                <select id="smoothing-method">
                    <option value="none">不平滑</option>
                    <option value="moving-average" selected>移动平均</option>
                    <option value="savitzky-golay">Savitzky-Golay</option>
                    <option value="gaussian">高斯滤波</option>
                </select>
            </div>

            <div class="form-group">
                <label for="smoothing-window">平滑窗口大小</label>
                <input type="number" id="smoothing-window" value="5" min="3" max="21" step="2">
                <span class="help-text">必须为奇数，值越大平滑效果越强</span>
            </div>

            <div class="switch-group">
                <span class="switch-label">启用基线校正</span>
                <label class="switch">
                    <input type="checkbox" id="baseline-correction" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="switch-group">
                <span class="switch-label">启用峰值检测</span>
                <label class="switch">
                    <input type="checkbox" id="peak-detection" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- 安全与合规 -->
        <div class="settings-panel">
            <h2>安全与合规 (CFR 21 Part 11)</h2>
            
            <div class="alert alert-info">
                📋 本系统符合 CFR 21 Part 11 电子记录和电子签名规范要求
            </div>

            <div class="switch-group">
                <span class="switch-label">启用审计跟踪</span>
                <label class="switch">
                    <input type="checkbox" id="audit-trail" checked disabled>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="switch-group">
                <span class="switch-label">强制电子签名</span>
                <label class="switch">
                    <input type="checkbox" id="require-signature" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-group">
                <label for="password-expiry">密码过期天数</label>
                <input type="number" id="password-expiry" value="90" min="30" max="365" step="1">
                <span class="help-text">用户密码的有效期</span>
            </div>

            <div class="form-group">
                <label for="session-timeout">会话超时 (分钟)</label>
                <input type="number" id="session-timeout" value="30" min="5" max="120" step="5">
                <span class="help-text">无操作自动登出时间</span>
            </div>
        </div>

        <!-- 系统维护 -->
        <div class="settings-panel">
            <h2>系统维护</h2>
            
            <div class="form-group">
                <label for="log-retention">日志保留天数</label>
                <input type="number" id="log-retention" value="365" min="30" max="3650" step="1">
                <span class="help-text">系统日志的保留时间</span>
            </div>

            <div class="form-group">
                <label for="backup-frequency">自动备份频率</label>
                <select id="backup-frequency">
                    <option value="daily" selected>每天</option>
                    <option value="weekly">每周</option>
                    <option value="monthly">每月</option>
                </select>
            </div>

            <div class="switch-group">
                <span class="switch-label">启用自动更新检查</span>
                <label class="switch">
                    <input type="checkbox" id="auto-update-check" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="button-group">
                <button class="btn btn-secondary" id="export-settings-btn">导出设置</button>
                <button class="btn btn-secondary" id="import-settings-btn">导入设置</button>
                <button class="btn btn-danger" id="reset-settings-btn">恢复默认</button>
            </div>
        </div>

        <!-- 保存按钮 -->
        <div class="button-group">
            <button class="btn btn-secondary" id="cancel-btn">取消</button>
            <button class="btn btn-primary" id="save-settings-btn">保存设置</button>
        </div>
    </div>

    <script src="assets/js/error-handler.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/system-settings.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            SystemSettingsManager.init();

            // 保存按钮
            document.getElementById('save-settings-btn').addEventListener('click', async () => {
                const settings = {
                    detection: {
                        scanLength: parseFloat(document.getElementById('scan-length').value),
                        positionStep: parseFloat(document.getElementById('position-step').value),
                        integrationTime: parseFloat(document.getElementById('integration-time').value),
                        countRateMax: parseInt(document.getElementById('count-rate-max').value)
                    },
                    device: {
                        probePort: document.getElementById('probe-port').value,
                        baudRate: parseInt(document.getElementById('baud-rate').value),
                        autoReconnect: document.getElementById('auto-reconnect').checked,
                        healthCheck: document.getElementById('health-check').checked
                    },
                    dataProcessing: {
                        smoothingMethod: document.getElementById('smoothing-method').value,
                        smoothingWindow: parseInt(document.getElementById('smoothing-window').value),
                        baselineCorrection: document.getElementById('baseline-correction').checked,
                        peakDetection: document.getElementById('peak-detection').checked
                    },
                    security: {
                        requireSignature: document.getElementById('require-signature').checked,
                        passwordExpiry: parseInt(document.getElementById('password-expiry').value),
                        sessionTimeout: parseInt(document.getElementById('session-timeout').value)
                    },
                    maintenance: {
                        logRetention: parseInt(document.getElementById('log-retention').value),
                        backupFrequency: document.getElementById('backup-frequency').value,
                        autoUpdateCheck: document.getElementById('auto-update-check').checked
                    }
                };

                try {
                    await SystemSettingsManager.saveSettings(settings);
                    const alert = document.getElementById('save-alert');
                    alert.style.display = 'block';
                    setTimeout(() => alert.style.display = 'none', 3000);
                } catch (error) {
                    console.error('保存设置失败:', error);
                    alert('保存设置失败，请重试');
                }
            });

            // 取消按钮
            document.getElementById('cancel-btn').addEventListener('click', () => {
                window.location.href = 'index.html';
            });

            // 恢复默认
            document.getElementById('reset-settings-btn').addEventListener('click', () => {
                if (confirm('确定要恢复默认设置吗？此操作不可撤销。')) {
                    location.reload();
                }
            });
        });
    </script>
</body>
</html>
