<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检测日志 - 放射化学纯度检测仪</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .page-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #667eea;
        }

        .page-title {
            font-size: 28px;
            color: #2d3748;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .filters-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .logs-table {
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .logs-table thead {
            background: #667eea;
            color: white;
        }

        .logs-table th,
        .logs-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        .logs-table tbody tr:hover {
            background: #f7fafc;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.success {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-badge.error {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-badge.warning {
            background: #feebc8;
            color: #7c2d12;
        }

        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            margin-right: 5px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
            font-size: 16px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content.large {
            max-width: 900px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #e2e8f0;
        }

        .modal-header h3 {
            margin: 0;
            color: #2d3748;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            color: #718096;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-item.full-width {
            grid-column: 1 / -1;
        }

        .detail-item label {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .detail-item span {
            color: #2d3748;
        }

        .raw-data-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }

        .raw-data-section h4 {
            color: #2d3748;
            margin-bottom: 15px;
        }

        .raw-data-table {
            width: 100%;
            font-size: 13px;
        }

        .raw-data-table th,
        .raw-data-table td {
            padding: 8px;
            border: 1px solid #e2e8f0;
        }

        .text-center {
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #4a5568;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .back-link:hover {
            color: #5568d3;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <a href="index.html" class="back-link">← 返回主页</a>
        
        <div class="page-header">
            <h1 class="page-title">🔍 检测日志</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" id="refresh-logs-btn">刷新</button>
                <button class="btn btn-primary" id="export-logs-btn">导出日志</button>
            </div>
        </div>

        <!-- 筛选面板 -->
        <div class="filters-panel">
            <div class="filters-grid">
                <div class="form-group">
                    <label for="log-start-date">开始日期</label>
                    <input type="date" id="log-start-date">
                </div>
                <div class="form-group">
                    <label for="log-end-date">结束日期</label>
                    <input type="date" id="log-end-date">
                </div>
                <div class="form-group">
                    <label for="log-device-filter">设备</label>
                    <select id="log-device-filter">
                        <option value="all">全部</option>
                        <option value="probe">碘化钠探头</option>
                        <option value="detector">计数器</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="log-status-filter">状态</label>
                    <select id="log-status-filter">
                        <option value="all">全部</option>
                        <option value="completed">已完成</option>
                        <option value="failed">失败</option>
                        <option value="running">进行中</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" id="filter-logs-btn">应用筛选</button>
        </div>

        <!-- 日志列表 -->
        <div id="logs-container">
            <div class="no-data">加载中...</div>
        </div>

        <!-- 分页 -->
        <div class="pagination">
            <button class="btn btn-secondary" id="logs-prev-page">上一页</button>
            <span id="logs-page-info">第 1 页</span>
            <button class="btn btn-secondary" id="logs-next-page">下一页</button>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="assets/js/error-handler.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/ui.js"></script>
    <script src="assets/js/detection-logs.js"></script>
    <script>
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            DetectionLogs.init();
        });
    </script>
</body>
</html>
